server {
  server_name lowfield.example;
  rewrite ^/old-contact/?$ /contact/ permanent;
  rewrite ^/press/(.*)$ /blog/$1 redirect;
  rewrite ^/internal$ /index.html last;
  location = /old-pricing { return 301 /pricing/; }
  location = /two-line {
    return 308 https://lowfield.example/about/;
  }
  location /prefix { return 301 /x/; }
  return 301 https://lowfield.example$request_uri;
}

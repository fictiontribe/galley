name: Something in this template is broken
description: A page, section, link or build step of this starter that doesn't work as the README says.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Paste any error output.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page or file, e.g. /pricing/ or src/components/sections/Hero.astro.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `node --version` and `npx astro --version`, and your package manager.

# Galley: the editor “editor” at https://cms.example.com, with Caddy in front for HTTPS.
# Written by `galley host recipe`. Start it in this folder with: docker compose up -d (project “galley-editor”)
name: galley-editor
services:
  editor:
    image: "ghcr.io/fictiontribe/galley:0.4.5"
    restart: unless-stopped
    env_file: .env
    # Hardened: an ordinary user, nothing written outside /data and /tmp, no extra powers.
    user: node
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    mem_limit: 2g
    pids_limit: 512
    # Time to finish a publish in progress and stop the preview (up to 20 s) before Docker kills it.
    stop_grace_period: 30s
    # Everything the editor keeps: the site, its settings and keys, its history.
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # No ports: only what is in front of it reaches it, by name.
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - editor
volumes:
  data:
  caddy-data:
  caddy-config:

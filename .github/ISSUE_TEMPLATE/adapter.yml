name: Adapter request
description: A static-site framework Galley should understand properly
labels: [adapter]
body:
  - type: markdown
    attributes:
      value: |
        Every framework beyond Astro arrives as an adapter. If you would like to write it, docs/adapters.md explains how, and the conformance kit proves it works.
  - type: input
    id: framework
    attributes:
      label: Framework and version
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Link to its documentation on content and routing
    validations:
      required: true
  - type: textarea
    id: shapes
    attributes:
      label: Where does content live, and how do files map to URLs?
      description: Folders, front-matter formats, data files, config files, permalink rules. A small invented example helps — no real company's content.
  - type: textarea
    id: detected
    attributes:
      label: What does Galley find today?
      description: Paste `galley doctor` for a site of this framework, if you have one.
      render: text
  - type: checkboxes
    id: help
    attributes:
      label: Help
      options:
        - label: I'd like to write this adapter myself

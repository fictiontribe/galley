# Publishes the six npm packages — galley-cms (the `galley` command),
# create-galley (`npm create galley@latest`), galleycms (`npx galleycms` alias),
# and the three standalone kits (@galleycms/astro, @galleycms/adapter-kit,
# @galleycms/plugin-kit) — with provenance.
#
#   On a version tag (vX.Y.Z, pushed by hand: RELEASING.md): install, check
#   the tag against the versions, typecheck, test, pack all six packages, verify
#   the tarballs, make and start a site from them in a clean folder, then
#   publish exactly the tarballs that were checked. A starter that is
#   downloaded when used ("download": true in its starter.json) travels as an
#   archive the bundle records by SHA-256: those archives are published first,
#   on a release of their own, starters-vX.Y.Z (RELEASING.md, "How the
#   starters travel").
#
#   By hand (Actions › Release › Run workflow): the same steps. "Dry run" is
#   on by default: nothing is published, and the tarballs are attached to the
#   run to download and look at. Turning it off publishes, and only works when
#   the workflow is run from a tag.
#
# Needs one repository secret, NPM_TOKEN: an npm granular access token with
# read and write access to galley-cms, create-galley, galleycms, and the
# @galleycms organization (RELEASING.md says how to make it). Four jobs, each
# with only the rights it needs: "release" installs, builds, checks and packs
# with a read-only token (any package's lifecycle script runs there); "starters"
# only makes or checks the starters' release, with "contents: write"; "publish"
# only publishes the checked tarballs to npm, after "starters", with the
# identity token npm's provenance needs; "docker" builds and smoke-tests the
# container image (and pushes multi-arch images to ghcr.io on version tags with
# "packages: write").
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: build, test, pack and verify, but don't publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The checks take about a quarter of an hour; the wait for galley-cms's tarball may add twenty minutes.
    timeout-minutes: 75
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.dry-run == false }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      archives: ${{ steps.downloaded.outputs.archives }}
    steps:
      - uses: actions/checkout@v4

      # Packed files go in the runner's temp folder: outside the repository, so the
      # site made from them cannot see the workspace, and a path the artifact upload accepts.
      - name: Choose where the packed files go
        run: echo "PACK=${RUNNER_TEMP}/pack" >> "$GITHUB_ENV"

      # Node 22: the starters are Astro 7 sites (22.23.4+); registry-url writes
      # the .npmrc that reads NODE_AUTH_TOKEN when publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: corepack enable

      # The tests make real commits in temporary repositories.
      - run: |
          git config --global user.name "Galley CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Publishing needs a tag
        if: env.PUBLISH == 'true' && github.ref_type != 'tag'
        run: |
          echo "::error::Publishing only happens from a version tag. Run the workflow from the tag (Use workflow from › Tags), or leave Dry run on."
          exit 1

      - run: pnpm install --frozen-lockfile

      - name: The versions agree
        id: version
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const read = (path) => JSON.parse(readFileSync(path, "utf8")).version;
            const cli = read("packages/cli/package.json");
            const create = read("packages/create-galley/package.json");
            const alias = read("packages/galleycms/package.json");
            const astro = read("packages/astro/package.json");
            const adapterKit = read("packages/adapter-kit/package.json");
            const pluginKit = read("packages/plugin-kit/package.json");
            const brand = /VERSION = "([^"]+)"/.exec(readFileSync("packages/core/src/brand.ts", "utf8"))?.[1];
            const tag = process.env.GITHUB_REF_TYPE === "tag" ? process.env.GITHUB_REF_NAME.replace(/^v/, "") : cli;
            const all = {
              "packages/cli": cli,
              "packages/create-galley": create,
              "packages/galleycms": alias,
              "packages/astro": astro,
              "packages/adapter-kit": adapterKit,
              "packages/plugin-kit": pluginKit,
              "brand.ts VERSION": brand,
              tag,
            };
            if (new Set(Object.values(all)).size !== 1) {
              console.error(`::error::The versions differ: ${JSON.stringify(all)}. Set them all to the same number (RELEASING.md, step 3).`);
              process.exit(1);
            }
            // A release candidate (0.2.0-rc.1) goes out as "next", so npm create galley@latest keeps the last release.
            const prerelease = cli.includes("-") ? "true" : "false";
            const distTag = prerelease === "true" ? "next" : "latest";
            console.log(`Version ${cli}, npm dist-tag ${distTag}, prerelease ${prerelease}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${cli}\ndist-tag=${distTag}\nprerelease=${prerelease}\n`);
          '

      - run: pnpm -r --if-present typecheck
      # One package at a time: the suites start real git repositories and dev servers.
      - run: pnpm -r --workspace-concurrency=1 --if-present test

      # galley-cms's prepack builds the web UI, the bundle, the site kit and the
      # starters into dist/; pnpm writes create-galley's and galleycms's
      # workspace ranges as the exact version. verify-kits-pack.mjs builds,
      # packs and verifies the three standalone @galleycms/* kits into $PACK.
      - name: Pack
        run: |
          mkdir -p "$PACK"
          pnpm --filter galley-cms pack --pack-destination "$PACK"
          pnpm --filter create-galley pack --pack-destination "$PACK"
          pnpm --filter galleycms pack --pack-destination "$PACK"

      - name: Verify the tarballs
        run: |
          node packages/cli/scripts/verify-pack.mjs "$PACK"/galley-cms-*.tgz "$PACK"/create-galley-*.tgz "$PACK"/galleycms-*.tgz
          node scripts/verify-kits-pack.mjs --pack-destination "$PACK"
          ls -l "$PACK"

      # From the tarballs, outside the repository, with nothing else installed:
      # make a site, install it, start Galley on it and ask for the site list.
      - name: Make and open a site from the tarballs
        run: |
          set -euo pipefail
          try="$RUNNER_TEMP/try"
          mkdir -p "$try/tools" "$try/home"
          cd "$try/tools"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$PACK/galley-cms-${{ steps.version.outputs.version }}.tgz" "$PACK/create-galley-${{ steps.version.outputs.version }}.tgz" "$PACK/galleycms-${{ steps.version.outputs.version }}.tgz"
          "$try/tools/node_modules/.bin/galleycms" version --json | grep -q '"version":"${{ steps.version.outputs.version }}"'
          cd "$try"
          export HOME="$try/home" GALLEY_TOKEN="release-check-token-0123456789" GALLEY_PREVIEW_PORTS="4785-4789"
          "$try/tools/node_modules/.bin/create-galley" ci-site --starter caddow --no-open --port 4780 > galley.log 2>&1 &
          pid=$!
          for i in $(seq 1 180); do
            if grep -q "Press Ctrl+C" galley.log; then break; fi
            if ! kill -0 "$pid" 2> /dev/null; then cat galley.log; exit 1; fi
            sleep 2
          done
          cat galley.log
          curl -fsS -H "authorization: Bearer $GALLEY_TOKEN" http://127.0.0.1:4780/api/sites | tee sites.json
          grep -q '"name":"Ci site"' sites.json
          test -z "$(git -C ci-site status --porcelain)"
          kill -TERM "$pid"
          wait "$pid" || true

      # Each starter that is downloaded when used, made from the tarballs with its archive served from this runner:
      # the record in the bundle and the archive the release will attach agree, and the site is made.
      - name: Make a site from each downloaded starter
        id: downloaded
        run: |
          set -euo pipefail
          assets="$GITHUB_WORKSPACE/packages/cli/starter-assets"
          if ! ls "$assets"/starters-*.tgz > /dev/null 2>&1; then echo "No starter is downloaded when used."; echo "archives=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "archives=yes" >> "$GITHUB_OUTPUT"
          try="$RUNNER_TEMP/try"
          python3 -m http.server 4799 --bind 127.0.0.1 --directory "$assets" > "$RUNNER_TEMP/assets.log" 2>&1 &
          server=$!
          sleep 1
          export HOME="$try/home" GALLEY_STARTER_DOWNLOADS="http://127.0.0.1:4799"
          for archive in "$assets"/starters-*.tgz; do
            id="$(basename "$archive" .tgz)"; id="${id#starters-}"
            "$try/tools/node_modules/.bin/galley" new "downloaded-$id" --starter "$id" --no-install --no-start --dir "$try"
            test -f "$try/downloaded-$id/package.json"
          done
          kill "$server"

      - uses: actions/upload-artifact@v4
        with:
          name: starter-archives-${{ steps.version.outputs.version }}
          path: packages/cli/starter-assets/*.tgz
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs-${{ steps.version.outputs.version }}
          path: ${{ env.PACK }}/*.tgz
          if-no-files-found: error

  # Before the packages: a galley-cms on npm downloads these, and the version's own release stays a draft until a
  # person publishes it (desktop.yml), so they go on a release of their own, published at once, a prerelease so
  # that ".../releases/latest" keeps naming the version's release. Run again, an archive already there is kept
  # (a published bundle may name it) and must be the same bytes: build.mjs writes the same archive for the same
  # files.
  starters:
    needs: release
    if: (github.event_name == 'push' || inputs.dry-run == false) && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # With no starter downloaded when used there is no archive, and nothing to make: the job passes, so npm goes on.
      - uses: actions/download-artifact@v4
        if: needs.release.outputs.archives == 'yes'
        with:
          name: starter-archives-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/archives

      - name: Publish the downloaded starters' archives
        if: needs.release.outputs.archives == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/archives"
          if ! ls "$assets"/starters-*.tgz > /dev/null 2>&1; then echo "::error::The release job made starter archives, and none arrived here."; exit 1; fi
          release="starters-v${{ needs.release.outputs.version }}"
          if ! gh release view "$release" > /dev/null 2>&1; then
            gh release create "$release" "$assets"/starters-*.tgz --target "$GITHUB_SHA" --prerelease \
              --title "Starters for ${{ needs.release.outputs.version }}" \
              --notes "The starters that galley-cms ${{ needs.release.outputs.version }} downloads each time a site is made from one. Each archive's SHA-256 is recorded in galley-cms and checked after download."
            exit 0
          fi
          have="$RUNNER_TEMP/have"
          mkdir -p "$have"
          for archive in "$assets"/starters-*.tgz; do
            name="$(basename "$archive")"
            if gh release download "$release" --pattern "$name" --dir "$have" --clobber 2> /dev/null; then
              if ! cmp -s "$archive" "$have/$name"; then echo "::error::$release already has a different $name. It was built from other files; the bundle would name the wrong archive."; exit 1; fi
            else
              gh release upload "$release" "$archive"
            fi
          done

  # galley-cms first: create-galley and galleycms depend on that exact version. The registry accepts galley-cms at once
  # and then takes some minutes over its tarball (about 14 MB) before anyone can install it: eight on 0.4.1.
  # Two things break in that window if nothing is done:
  #   - the new create-galley and galleycms ask for a galley-cms that isn't there yet, so `npm create galley@latest` and `npx galleycms` fail;
  #   - "latest" already names the new galley-cms, so `npx galley-cms` and `npm install galley-cms` fail too.
  # So galley-cms is published under a tag of its own ("incoming"), which nobody asks for; the step waits
  # until the registry lists the version and its tarball answers; only then does "latest" move to it, and
  # only then are create-galley, galleycms and the @galleycms/* kits published.
  # "incoming" is left where it is: the release's token may add or move a tag and may not remove one
  # (0.4.2: the removal was refused), and the next release moves it to its own version.
  publish:
    needs: [release, starters]
    if: (github.event_name == 'push' || inputs.dry-run == false) && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The wait for galley-cms's tarball may take twenty minutes.
    timeout-minutes: 40
    permissions:
      contents: read
      # npm provenance: the registry checks this workflow's identity token.
      id-token: write
    steps:
      - name: Choose where the packed files go
        run: echo "PACK=${RUNNER_TEMP}/pack" >> "$GITHUB_ENV"

      # registry-url writes the .npmrc that reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Exactly the tarballs the release job checked.
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/pack

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::The NPM_TOKEN secret isn't set (RELEASING.md)."; exit 1; fi
          version="${{ needs.release.outputs.version }}"
          tag="${{ needs.release.outputs.dist-tag }}"
          tarball="https://registry.npmjs.org/galley-cms/-/galley-cms-$version.tgz"
          listed() { [ -n "$(npm view "$1@$version" version 2> /dev/null)" ]; }
          answers() { [ "$(curl -s -o /dev/null -w '%{http_code}' -I "$tarball" || true)" = "200" ]; }
          # publish <package-name> <tarball-stem> <dist-tag>. Run again after stopping part-way, it leaves what npm
          # already has as it is: a version the registry lists, or one it has accepted and doesn't list yet (it refuses a second).
          publish() {
            if listed "$1"; then
              echo "$1@$version is already on npm."
              return
            fi
            if out="$(npm publish "$PACK/$2-$version.tgz" --provenance --access public --tag "$3" 2>&1)"; then
              echo "$out"
            elif echo "$out" | grep -qi "previously published\|cannot publish over"; then
              echo "$1@$version was already accepted by npm."
            else
              echo "$out"
              exit 1
            fi
          }
          publish galley-cms galley-cms incoming
          echo "Waiting until galley-cms@$version can be installed: listed by the registry, and $tarball answering."
          # Every 15 seconds, for 20 minutes at most.
          for try in $(seq 1 80); do
            if listed galley-cms && answers; then
              echo "It can (after about $(( (try - 1) * 15 )) seconds)."
              break
            fi
            if [ "$try" = "80" ]; then
              echo "::error::galley-cms@$version is on npm under the tag \"incoming\", but it still couldn't be installed after 20 minutes, so \"$tag\" was not moved to it and create-galley/galleycms were not published. Nobody is given the new version: npx galley-cms, npx galleycms and npm create galley@latest still give the last release. When $tarball answers 200, run this workflow again from the tag with Dry run off; it leaves galley-cms as it is, moves \"$tag\" and publishes the remaining packages."
              exit 1
            fi
            sleep 15
          done
          # If create-galley@$version is already on npm, galley-cms's dist-tag was moved before (and may have moved on
          # since): leave galley-cms's dist-tag untouched so an older tag can never move "latest" backwards, then
          # still check and publish any remaining packages (galleycms and @galleycms/*) idempotently.
          if listed create-galley; then
            echo "create-galley@$version is already on npm, so galley-cms \"$tag\" is left where it is."
          elif ! npm dist-tag add "galley-cms@$version" "$tag"; then
            echo "::error::galley-cms@$version can be installed, but npm refused to move \"$tag\" to it (see above), so create-galley and galleycms were not published. Nobody is given the new version yet. By hand, signed in to npm as an owner: npm dist-tag add galley-cms@$version $tag. Then run this workflow again from the tag with Dry run off; it finds the tag in place and publishes the remaining packages."
            exit 1
          fi
          publish create-galley create-galley "$tag"
          publish galleycms galleycms "$tag"
          publish @galleycms/astro galleycms-astro "$tag"
          publish @galleycms/adapter-kit galleycms-adapter-kit "$tag"
          publish @galleycms/plugin-kit galleycms-plugin-kit "$tag"

  # Builds and smoke-tests the hosted container image from Dockerfile.
  # On a dry run, "starters" is skipped and this job still builds linux/amd64
  # locally and verifies /healthz without pushing. On a version tag release (or
  # manual run from a tag with Dry run off), it waits for "starters" so
  # downloadable starter archives exist on GitHub Releases before the image is
  # published, smoke-tests linux/amd64 first, then builds and pushes
  # linux/amd64 and linux/arm64 to GHCR.
  # Run again from a tag whose version image is already published for both architectures,
  # it leaves existing tags untouched so an older tag can never move "latest" backwards.
  docker:
    needs: [release, starters]
    if: always() && needs.release.result == 'success' && (needs.starters.result == 'success' || needs.starters.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ (github.event_name == 'push' || inputs.dry-run == false) && github.ref_type == 'tag' }}
      IMAGE: ghcr.io/fictiontribe/galley
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the native linux/amd64 image and load it locally to smoke-test /healthz
      # before pushing anything (and on dry runs to prove Dockerfile builds and boots).
      - name: Build linux/amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container /healthz
        run: |
          set -euo pipefail
          image_tag="${IMAGE}:${{ needs.release.outputs.version }}"
          cleanup() {
            docker rm -f galley-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d \
            --name galley-smoke \
            -p 127.0.0.1:4400:4400 \
            -e GALLEY_PUBLIC_URL=http://127.0.0.1:4400 \
            "$image_tag"
          body=""
          for i in $(seq 1 30); do
            if body="$(curl -fsS http://127.0.0.1:4400/healthz 2>/dev/null)" && [ "$body" = '{"ok":true}' ]; then
              echo "Health check passed: $body"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' galley-smoke 2>/dev/null || echo false)" != "true" ]; then
              echo "::error::Container exited before /healthz became ready."
              docker logs galley-smoke || true
              exit 1
            fi
            sleep 1
          done
          echo "::error::Timed out waiting for /healthz to return {\"ok\":true} (last response: ${body:-none})."
          docker logs galley-smoke || true
          exit 1

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version image is already published
        id: existing
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          ref="${IMAGE}:${{ needs.release.outputs.version }}"
          if out="$(docker buildx imagetools inspect "$ref" 2>/dev/null)" && echo "$out" | grep -q "linux/amd64" && echo "$out" | grep -q "linux/arm64"; then
            echo "$ref is already published for linux/amd64 and linux/arm64; skipping push so existing tags are left untouched."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image tags
        id: tags
        if: env.PUBLISH == 'true' && steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          version="${{ needs.release.outputs.version }}"
          prerelease="${{ needs.release.outputs.prerelease }}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            if [ "$prerelease" != "true" ]; then
              major_minor="$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+)\..*$/\1/')"
              if echo "$major_minor" | grep -Eq '^[0-9]+\.[0-9]+$'; then
                echo "${IMAGE}:${major_minor}"
              fi
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: env.PUBLISH == 'true' && steps.existing.outputs.published != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Build and push multi-arch image to GHCR
        if: env.PUBLISH == 'true' && steps.existing.outputs.published != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/fictiontribe/galley
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
